<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="IdeaForge Logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1B365D"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Container Pill -->
  <rect x="2" y="2" width="516" height="116" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Geometric Forge + Spark Emblem -->
  <g transform="translate(26, 22)">
    <rect x="0" y="0" width="76" height="76" rx="14" fill="#0B1220" stroke="#334155" stroke-width="1"/>
    <!-- Anvil Base -->
    <path d="M16 50 L60 50 L55 60 L21 60 Z" fill="#94A3B8"/>
    <path d="M12 40 L64 40 L57 49 L19 49 Z" fill="#E2E8F0"/>
    <!-- Horn Accent -->
    <path d="M12 40 L20 35 L26 40 Z" fill="#CBD5E1"/>
    <!-- Forged Spark / Diamond Idea -->
    <path d="M38 11 L45 24 L58 27 L45 30 L38 43 L31 30 L18 27 L31 24 Z" fill="url(#sparkGrad)"/>
    <circle cx="55" cy="16" r="2.2" fill="#FDE68A"/>
    <circle cx="22" cy="17" r="1.6" fill="#93C5FD"/>
  </g>

  <!-- Wordmark & Tagline -->
  <text x="122" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">Idea<tspan fill="#FBBF24">Forge</tspan></text>
  <text x="124" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#94A3B8">IDEA-TO-DECISION STRATEGIC AI TOOLKIT</text>
</svg>

  <text x="349" y="104" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="8.5" fill="#1A1D21">Tax: 995 IDR</text>
  <rect x="124.3" y="56" width="515.7" height="30" fill="#15803D"/>
  <text x="382.2" y="75" text-anchor="middle" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">86%</text>
  <rect x="484" y="96" width="9" height="9" fill="#15803D" rx="1"/>
  <text x="497" y="104" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="8.5" fill="#1A1D21">Net Margin: 171k IDR</text>
  <text x="40" y="134" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#111317">LTV vs CAC (Rasio: 13.7x):</text>

  <text x="522.0" y="156" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="600" fill="#1B365D">3.8M IDR</text>
  <rect x="95" y="166" width="30.8" height="16" fill="#D97706" rx="2"/>
  <text x="40" y="178" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="9" fill="#374151">CAC</text>
  <text x="132.8" y="178" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="600" fill="#B45309">280k IDR</text>

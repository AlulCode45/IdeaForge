  <text x="53" y="104" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="8.5" fill="#1A1D21">COGS: 22k IDR</text>
  <rect x="106.3" y="56" width="15.0" height="30" fill="#D97706"/>
  <rect x="188" y="96" width="9" height="9" fill="#D97706" rx="1"/>
  <text x="201" y="104" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="8.5" fill="#1A1D21">Channel Fee: 5k IDR</text>
  <rect x="121.3" y="56" width="3.0" height="30" fill="#94A3B8"/>

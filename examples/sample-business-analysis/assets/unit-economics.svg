<svg viewBox="0 0 680 195" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Unit Economics Breakdown">
  <rect x="0" y="0" width="680" height="195" fill="#FFFFFF"/>
  <text x="40" y="22" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#111317">3. Unit Economics (199k IDR/unit) &amp; LTV vs CAC Ratio</text>
